name: Changelog Generator
on:
  pull_request:
    branches:
      - master
    types: [ opened, reopened, synchronize ]

jobs:
  changelog:
    name: Chanegelog Generator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Force Node.js 24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false  # Don't allow insecure versions
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHANGE_LOG }}
          fetch-depth: 0  # Need full history to get tags

      # Get current date
      - name: Get current date
        id: date
        run: echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      # Create/Update CHANGELOG.md and comment on PR
      - name: Create PR Changelog Comment and Update CHANGELOG.md
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CHANGE_LOG }}
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const date = '${{ steps.date.outputs.date }}';

            // Create clean changelog entry
            const changelogEntry = `## [PR #${pr.number}] - ${date}\n\n### ${pr.title}\n\n${pr.body || '*No description provided*'}\n\n**Author:** @${pr.user.login}\n**Changed files:** ${pr.changed_files}\n**Commits:** ${pr.commits}\n\n---\n\n`;

            const changelogPath = 'CHANGELOG.md';
            let content = '# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n';

            try {
              const existing = fs.readFileSync(changelogPath, 'utf8');
              if (!existing.includes(`## [PR #${pr.number}]`)) {
                // Insert after header
                const lines = existing.split('\n');
                let insertIndex = 0;
                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].startsWith('# Changelog')) {
                    insertIndex = i + 2; // After title and empty line
                    break;
                  }
                }
                lines.splice(insertIndex, 0, changelogEntry);
                content = lines.join('\n');
              } else {
                content = existing;
                console.log(`⚠️ PR #${pr.number} already in CHANGELOG.md`);
              }
            } catch (error) {
              content = '# Changelog\n\n' + changelogEntry;
            }

            fs.writeFileSync(changelogPath, content);
            console.log(`✅ CHANGELOG.md updated with PR #${pr.number}`);

      # Commit and push CHANGELOG.md changes
      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md for PR #${{ github.event.pull_request.number }}"
          file_pattern: CHANGELOG.md
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
